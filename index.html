<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Budget Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#e2e0db;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}

/* Mobile layout */
.app-wrap{max-width:440px;margin:0 auto;padding-bottom:40px}

/* Desktop layout */
@media(min-width:768px){
  body{padding:0}
  .app-wrap{max-width:1100px;display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto;column-gap:24px;padding:32px 32px 40px;align-items:start}
  .col-left{grid-column:1;display:flex;flex-direction:column;gap:0}
  .col-right{grid-column:2;position:sticky;top:32px}
  .header{padding:0 0 16px 0}
  .sync-bar{padding:0 0 0 0}
  .month-nav{padding:14px 0 0 0}
  .summary-card{margin:12px 0 0 0}
  .cat-breakdown{margin:0}
  .stats-row{margin:10px 0 0 0}
  .cal-wrap{padding:14px 0 0 0}
  .day-panel{margin:0;border-radius:14px}
  .btn-sync-lama{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:9px 12px;border-radius:10px;border:1px dashed #2a2a38;background:#0a0a0f;color:#555;font-size:11px;cursor:pointer;text-align:center;transition:all .15s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box}
.btn-sync-lama:hover{border-color:#f97316;color:#f97316}
.btn-sync-lama.done{border-color:#10b981;color:#10b981;border-style:solid}

.day-panel-placeholder{display:flex;align-items:center;justify-content:center;min-height:300px;background:#16161e;border-radius:14px;border:1px solid #1e1e28;color:#333;font-size:13px;flex-direction:column;gap:8px}
  .day-panel-placeholder .ico{font-size:32px}
}

@media(max-width:767px){
  .app-wrap{max-width:440px;margin:0 auto;padding-bottom:40px}
  .col-left,.col-right{display:contents}
  .day-panel-placeholder{display:none}
}

.header{padding:28px 20px 0}
.header-sub{font-size:10px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:4px}
.header-title{font-size:24px;font-weight:800;color:#f0ede8;letter-spacing:-0.5px}

.sync-bar{display:flex;align-items:center;gap:6px;padding:8px 20px 0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0;transition:background .3s}
.sync-dot.syncing{background:#f97316;animation:pulse 1s infinite}
.sync-dot.error{background:#ef4444}
.sync-text{font-size:10px;color:#555;letter-spacing:.5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.month-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
.month-label{font-size:15px;font-weight:700;color:#f0ede8}
.nav-btns{display:flex;gap:6px}
.nav-btn{background:#16161e;border:1px solid #222;color:#888;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.summary-card{margin:12px 16px 0;background:#16161e;border-radius:14px;padding:14px 16px;border:1px solid #1e1e28}
.summary-row{display:flex;justify-content:space-between;align-items:center}
.sum-label{font-size:10px;color:#444;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.sum-amount{font-size:22px;font-weight:800;color:#f97316}
.sum-amount.empty{color:#333;font-size:14px;font-weight:400}
.btn-detail{background:#0a0a0f;border:1px solid #222;color:#666;border-radius:8px;padding:7px 13px;font-size:11px;font-weight:600;cursor:pointer}
.btn-detail.active{background:#f97316;border-color:#f97316;color:#fff}

.cat-breakdown{margin:0 16px;background:#16161e;border-radius:0 0 14px 14px;padding:14px 16px;display:none;border:1px solid #1e1e28;border-top:none}
.cat-breakdown.show{display:block}
.cat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.cat-row:last-child{margin-bottom:0}
.cat-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:8px}
.cat-name{font-size:12px;color:#bbb}
.cat-amount{font-size:12px;font-weight:700}
.cat-bar-wrap{margin-top:10px;padding-top:10px;border-top:1px solid #1e1e28;display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden}
.cat-row{cursor:pointer;border-radius:6px;padding:4px 2px;margin-bottom:5px!important;transition:background .12s}
.cat-row:hover{background:#1e1e28}
.cat-detail{display:none;margin-bottom:8px;padding:8px 10px;background:#0f0f13;border-radius:8px;border-left:2px solid #333}
.cat-detail.show{display:block}
.cat-detail-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a}
.cat-detail-item:last-child{border-bottom:none}
.cat-detail-date{font-size:10px;color:#555;min-width:60px}
.cat-detail-ket{font-size:11px;color:#aaa;flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-detail-amt{font-size:11px;font-weight:700;white-space:nowrap}
.cat-detail-sumber{font-size:9px;padding:1px 5px;border-radius:99px;margin-left:4px}
.cat-empty{font-size:12px;color:#333}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 16px 0}
.stat-card{background:#16161e;border-radius:10px;padding:11px 12px;border:1px solid #1e1e28;text-align:center}
.stat-val{font-size:15px;font-weight:800;color:#f0ede8;margin-bottom:2px}
.stat-lbl{font-size:9px;color:#444;letter-spacing:.5px;text-transform:uppercase}

.cal-wrap{padding:14px 16px 0}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.day-header{text-align:center;font-size:9px;color:#444;letter-spacing:1px;text-transform:uppercase;padding:4px 0;font-weight:600}
.day-header.wknd{color:#f97316;opacity:.5}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#16161e;border:1.5px solid transparent;position:relative;transition:all .12s}
.day-cell.empty{background:transparent;cursor:default;pointer-events:none}
.day-cell.today{border-color:#f97316}
.day-cell.today .day-num{color:#f97316;font-weight:800}
.day-cell.has-data .day-dot{display:block}
.day-cell.selected{background:#f97316;border-color:#f97316}
.day-cell.selected .day-num,.day-cell.selected .day-total-mini{color:#fff}
.day-cell:not(.empty):hover{background:#1e1e28;border-color:#333}
.day-cell.selected:hover{background:#ea6c10}
.day-num{font-size:13px;font-weight:500;color:#ccc;line-height:1}
.day-dot{display:none;width:4px;height:4px;border-radius:50%;background:#f97316;margin-top:3px}
.day-cell.selected .day-dot{background:#fff}
.day-cell.wknd-day .day-num{color:#f97316;opacity:.7}
.day-total-mini{font-size:8px;color:#666;margin-top:2px;font-weight:500}

.day-panel{margin:14px 16px 0;background:#16161e;border-radius:14px;padding:16px;border:1px solid #1e1e28;display:none}
.day-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.day-panel-title{font-size:15px;font-weight:700}
.day-panel-total{font-size:13px;color:#f97316;font-weight:600;margin-top:2px}
.btn-add{background:#f97316;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}

.form-wrap{margin-top:12px;background:#0f0f13;border-radius:10px;padding:14px;border:1px solid #1e1e28;display:none}
.form-wrap.show{display:block}
.form-edit-title{font-size:13px;font-weight:700;color:#f0ede8;margin-bottom:12px}
.form-label{font-size:10px;color:#444;letter-spacing:1px;margin-bottom:6px}
.kat-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.kat-btn{padding:5px 10px;border-radius:14px;border:1.5px solid #222;background:transparent;color:#555;font-size:11px;cursor:pointer;transition:all .12s}
.kat-btn.sel{font-weight:600}
.form-input{width:100%;background:#0a0a0f;border:1px solid #222;border-radius:7px;padding:9px 11px;color:#e2e0db;font-size:12px;outline:none;margin-bottom:9px;font-family:inherit}
.form-input.num{font-size:14px;font-weight:700}
.form-input::placeholder{color:#333}
.form-row{display:flex;gap:7px}
.btn-cancel{flex:1;padding:9px;border-radius:7px;border:1px solid #222;background:transparent;color:#666;font-size:12px;cursor:pointer}
.btn-save{flex:2;padding:9px;border-radius:7px;border:none;background:#333;color:#555;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-save.ready{background:#f97316;color:#fff}

.entries-list{display:flex;flex-direction:column;gap:7px}
.entry-item{background:#0f0f13;border-radius:9px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;border-left:2.5px solid #333;transition:opacity .2s}
.entry-item.removing{opacity:.4}
.entry-kat{font-size:12px;color:#ccc}
.entry-ket{font-size:10px;color:#555;margin-top:1px}
.entry-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.entry-amt{font-size:13px;font-weight:700}
.btn-edit{background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:0;line-height:1;margin-right:2px}
.btn-edit:hover{color:#f97316}
.btn-del{background:none;border:none;color:#333;font-size:18px;cursor:pointer;padding:0;line-height:1}
.day-empty{text-align:center;padding:24px 0;color:#333;font-size:12px;line-height:2}

/* PIN Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:#16161e;border:1px solid #2a2a38;border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center}
.modal-icon{font-size:32px;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700;color:#f0ede8;margin-bottom:6px}
.modal-sub{font-size:12px;color:#555;margin-bottom:20px}
.pin-input{width:100%;background:#0a0a0f;border:1.5px solid #222;border-radius:10px;padding:14px;color:#f0ede8;font-size:22px;font-weight:800;letter-spacing:8px;text-align:center;outline:none;margin-bottom:8px;font-family:inherit}
.pin-input:focus{border-color:#f97316}
.pin-error{font-size:11px;color:#ef4444;margin-bottom:12px;min-height:16px}
.btn-pin{width:100%;padding:12px;border-radius:10px;border:none;background:#f97316;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-pin-cancel{width:100%;padding:10px;border-radius:10px;border:1px solid #222;background:transparent;color:#666;font-size:13px;cursor:pointer}

.sumber-grid{display:flex;gap:6px;margin-bottom:12px}
.sumber-btn{flex:1;padding:7px 6px;border-radius:10px;border:1.5px solid #222;background:transparent;color:#555;font-size:11px;cursor:pointer;text-align:center;transition:all .12s;font-weight:500}
.sumber-btn.sel-sendiri{border-color:#10b981;background:#10b98122;color:#10b981;font-weight:700}
.sumber-btn.sel-titipan{border-color:#3b82f6;background:#3b82f622;color:#3b82f6;font-weight:700}
.sumber-btn.sel-khusus{border-color:#8b5cf6;background:#8b5cf622;color:#8b5cf6;font-weight:700}
.sumber-badge{font-size:9px;padding:2px 6px;border-radius:99px;font-weight:600;margin-left:4px;vertical-align:middle}
.badge-sendiri{background:#10b98122;color:#10b981}
.badge-titipan{background:#3b82f622;color:#3b82f6}
.badge-khusus{background:#8b5cf622;color:#8b5cf6}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:99px}
</style>
</head>
<body>

<!-- PIN Modal -->
<div class="modal-overlay" id="pinModal" style="display:none">
  <div class="modal-box">
    <div class="modal-icon">🔐</div>
    <div class="modal-title">Masukkan PIN</div>
    <div class="modal-sub">Diperlukan untuk menyimpan atau menghapus data</div>
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="10" placeholder="••••••" oninput="clearPinError()" onkeydown="if(event.key==='Enter')confirmPin()">
    <div class="pin-error" id="pinError"></div>
    <button class="btn-pin" onclick="confirmPin()">Konfirmasi</button>
    <button class="btn-pin-cancel" onclick="cancelPin()">Batal</button>
  </div>
</div>

<div class="app-wrap">
<div class="col-left">
<div class="header">
  <div class="header-sub">Personal Finance</div>
  <div class="header-title">Budget Tracker</div>
</div>

<div class="sync-bar">
  <div class="sync-dot" id="syncDot"></div>
  <div class="sync-text" id="syncText">Memuat...</div>
</div>

<div class="month-nav">
  <div class="month-label" id="monthLabel"></div>
  <div class="nav-btns">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>
</div>

<div class="summary-card">
  <div class="summary-row">
    <div>
      <div class="sum-label">Total Bulan Ini</div>
      <div class="sum-amount empty" id="monthTotal">—</div>
    </div>
    <button class="btn-detail" id="btnDetail" onclick="toggleDetail()">Rincian</button>
  </div>
</div>
<div class="cat-breakdown" id="catBreakdown"></div>

<div class="stats-row">
  <div class="stat-card"><div class="stat-val" id="statHari">—</div><div class="stat-lbl">Hari Tercatat</div></div>
  <div class="stat-card"><div class="stat-val" id="statRata">—</div><div class="stat-lbl">Rata/Hari</div></div>
  <div class="stat-card"><div class="stat-val" id="statTerboros">—</div><div class="stat-lbl">Hari Terboros</div></div>
</div>

<button class="btn-sync-lama" id="btnSyncLama" onclick="syncDataLama()">⟳ Sinkron Sumber data lama</button>

<div class="cal-wrap">
  <div class="day-headers">
    <div class="day-header">Sen</div><div class="day-header">Sel</div>
    <div class="day-header">Rab</div><div class="day-header">Kam</div>
    <div class="day-header">Jum</div>
    <div class="day-header wknd">Sab</div><div class="day-header wknd">Min</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

</div><!-- /col-left -->
<div class="col-right">
<div class="day-panel-placeholder" id="dayPanelPlaceholder">
  <div class="ico">📅</div>
  <div>Pilih tanggal untuk melihat detail</div>
</div>
<div class="day-panel" id="dayPanel">
  <div class="day-panel-header">
    <div>
      <div class="day-panel-title" id="dayPanelTitle"></div>
      <div class="day-panel-total" id="dayPanelTotal"></div>
    </div>
    <button class="btn-add" onclick="onTambah()">+ Tambah</button>
  </div>
  <div class="form-wrap" id="formWrap">
    <div class="form-edit-title" id="formTitle">Tambah Entri</div>
    <div class="form-label">KATEGORI</div>
    <div class="kat-grid" id="katGrid"></div>
    <div class="form-label">KETERANGAN (opsional)</div>
    <input class="form-input" id="inpKet" type="text" placeholder="warteg, gorengan, dll...">
    <div class="form-label">SUMBER</div>
    <div class="sumber-grid" id="sumberGrid"></div>
    <div class="form-label">JUMLAH (Rp)</div>
    <input class="form-input num" id="inpJumlah" type="number" placeholder="15000" oninput="checkSave()">
    <div class="form-row">
      <button class="btn-cancel" onclick="closeForm()">Batal</button>
      <button class="btn-save" id="btnSave" onclick="saveEntry()">Simpan</button>
    </div>
  </div>
  <div id="entriesList"></div>
</div><!-- /day-panel -->
</div><!-- /col-right -->
</div><!-- /app-wrap -->

<script>
const API      = "https://script.google.com/macros/s/AKfycbxBk1FJRRuVesU0KUG2cxiM3M2JJx61y2mu0yiusHubyLL-v2o-okIcOGa08BjhCJQ/exec";
const MONTHS   = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const DAYS_ID  = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const KATEGORI = [
  {label:"🍜 Makan",    color:"#f97316"},
  {label:"🚌 Transport",color:"#3b82f6"},
  {label:"📱 Kuota",    color:"#8b5cf6"},
  {label:"🛒 Belanja",  color:"#10b981"},
  {label:"🎮 Hiburan",  color:"#ec4899"},
  {label:"💊 Kesehatan",color:"#06b6d4"},
  {label:"📦 Lainnya",  color:"#6b7280"},
];
const TODAY = new Date();

// ── State ────────────────────────────────────────────────────
let curYear  = TODAY.getFullYear();
let curMonth = TODAY.getMonth();
let selDay   = TODAY.getDate();
let selKat   = KATEGORI[0].label;
let selSumber = 'Sendiri';
let editingId = null;
let showForm = false;
let showDetail = false;
let cache    = []; // in-memory + localStorage backed

// PIN state
let pinAuthed = sessionStorage.getItem("pinAuthed") === "1";
let pinCallback = null;

// ── Cache helpers ────────────────────────────────────────────
function cacheKey(y,m){ return `bt_${y}_${m}`; }

function readCache(y,m){
  try{ return JSON.parse(localStorage.getItem(cacheKey(y,m)))||[]; }catch{return[];}
}
function writeCache(y,m,data){
  try{ localStorage.setItem(cacheKey(y,m), JSON.stringify(data)); }catch{}
}

// ── API ──────────────────────────────────────────────────────
function buildUrl(params){
  return API+"?"+Object.entries(params)
    .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
}
async function apiFetch(params){
  const res = await fetch(buildUrl(params));
  return res.json();
}

async function fetchFromServer(y,m){
  setSyncState("syncing","Memperbarui...");
  try{
    const data = await apiFetch({action:"get", year:y, month:m+1});
    if(data.ok){
      writeCache(y,m,data.data||[]);
      setSyncState("ok","Tersinkron ✓");
      return data.data||[];
    } else {
      setSyncState("error","Gagal: "+data.error);
      return null;
    }
  } catch(e){
    setSyncState("error","Gagal terhubung");
    return null;
  }
}

// ── Sync data lama ──────────────────────────────────────────
async function syncDataLama(){
  const btn = document.getElementById("btnSyncLama");
  if(!pinAuthed){ requestPin(()=>syncDataLama()); return; }
  const pin = sessionStorage.getItem("pin");
  btn.textContent="Menyinkron...";
  btn.disabled=true;
  try{
    const res = await apiFetch({action:"bulkUpdate", pin});
    if(res.ok){
      btn.textContent=`✓ Selesai — ${res.updated} entri diperbarui`;
      btn.classList.add("done");
      btn.disabled=true;
      // Refresh cache
      const fresh = await fetchFromServer(curYear, curMonth);
      if(fresh){ cache=fresh; renderAll(); }
    } else {
      btn.textContent="Gagal: "+res.error;
      btn.disabled=false;
    }
  } catch(e){
    btn.textContent="Gagal terhubung";
    btn.disabled=false;
  }
}

// ── Load month — instant from cache, refresh in background ──
async function loadMonth(forceSync=false){
  // 1. Tampilkan cache lokal dulu → instant
  cache = readCache(curYear, curMonth);
  renderAll();

  // 2. Fetch dari server di background
  const fresh = await fetchFromServer(curYear, curMonth);
  if(fresh !== null){
    cache = fresh;
    renderAll();
  }
}

// ── Sync state indicator ─────────────────────────────────────
function setSyncState(state, text){
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  dot.className = "sync-dot"+(state==="syncing"?" syncing":state==="error"?" error":"");
  txt.textContent = text;
}

// ── Format helpers ───────────────────────────────────────────
function fmt(n){ return Number(n).toLocaleString("id-ID"); }
function fmtShort(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace(".0","")+"jt";
  if(n>=1000)    return Math.round(n/1000)+"rb";
  return String(n);
}
function getEntries(d){ return cache.filter(e=>Number(e.hari)===d); }
function sumEntries(arr){ return arr.reduce((s,e)=>s+Number(e.jumlah),0); }

// ── Render ───────────────────────────────────────────────────
function renderAll(){
  document.getElementById("monthLabel").textContent = `${MONTHS[curMonth]} ${curYear}`;
  renderCalendar();
  renderSummary();
  renderDayPanel();
  renderKatGrid();
  renderSumberGrid();
}

function renderCalendar(){
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const firstDow    = new Date(curYear, curMonth, 1).getDay();
  const offset      = firstDow===0 ? 6 : firstDow-1;
  const isCurMon    = curYear===TODAY.getFullYear() && curMonth===TODAY.getMonth();

  for(let i=0;i<offset;i++){
    const el=document.createElement("div");
    el.className="day-cell empty";
    grid.appendChild(el);
  }
  for(let d=1;d<=daysInMonth;d++){
    const entries = getEntries(d);
    const total   = sumEntries(entries);
    const dow     = new Date(curYear,curMonth,d).getDay();
    const el      = document.createElement("div");
    let cls = "day-cell";
    if(dow===0||dow===6)              cls+=" wknd-day";
    if(isCurMon && d===TODAY.getDate()) cls+=" today";
    if(d===selDay)                    cls+=" selected";
    if(entries.length>0)              cls+=" has-data";
    el.className=cls;
    el.onclick=()=>selectDay(d);
    el.innerHTML=`<span class="day-num">${d}</span>
      <span class="day-dot"></span>
      ${total>0?`<span class="day-total-mini">${fmtShort(total)}</span>`:""}`;
    grid.appendChild(el);
  }
}

function renderSummary(){
  const total = sumEntries(cache);
  // total display handled below with sumber breakdown

  const byDay={};
  cache.forEach(e=>{ const d=Number(e.hari); byDay[d]=(byDay[d]||0)+Number(e.jumlah); });
  const filled = Object.keys(byDay).length;
  document.getElementById("statHari").textContent    = filled||"0";
  document.getElementById("statRata").textContent    = filled ? fmtShort(Math.round(total/filled)) : "—";
  if(filled){
    const max = Object.entries(byDay).reduce((a,b)=>b[1]>a[1]?b:a);
    document.getElementById("statTerboros").textContent = max[0];
  } else {
    document.getElementById("statTerboros").textContent = "—";
  }
  // Sumber breakdown
  const totalSendiri = cache.filter(e=>(e.sumber||"Sendiri")==="Sendiri").reduce((s,e)=>s+Number(e.jumlah),0);
  const totalTitipan = cache.filter(e=>e.sumber==="Titipan").reduce((s,e)=>s+Number(e.jumlah),0);
  const totalKhusus  = cache.filter(e=>e.sumber==="Budget Khusus").reduce((s,e)=>s+Number(e.jumlah),0);
  const elAmt = document.getElementById("monthTotal");
  if(total>0){
    let sub = "";
    if(totalSendiri>0) sub+=`<span style="font-size:11px;color:#10b981;display:block;margin-top:2px">Sendiri: Rp ${fmt(totalSendiri)}</span>`;
    if(totalTitipan>0) sub+=`<span style="font-size:11px;color:#3b82f6;display:block">Titipan: Rp ${fmt(totalTitipan)}</span>`;
    if(totalKhusus>0)  sub+=`<span style="font-size:11px;color:#8b5cf6;display:block">Budget Khusus: Rp ${fmt(totalKhusus)}</span>`;
    elAmt.innerHTML=`Rp ${fmt(total)}`+sub;
    elAmt.classList.remove("empty");
  } else {
    elAmt.textContent="Belum ada catatan";
    elAmt.classList.add("empty");
  }

  if(showDetail) renderCatBreakdown();
}

function renderCatBreakdown(){
  const bd    = document.getElementById("catBreakdown");
  const total = sumEntries(cache);
  if(!total){ bd.innerHTML=`<div class="cat-empty">Belum ada data.</div>`; return; }
  const totals={};
  cache.forEach(e=>{ totals[e.kategori]=(totals[e.kategori]||0)+Number(e.jumlah); });
  const rows = KATEGORI.map(k=>({...k,total:totals[k.label]||0}))
    .filter(k=>k.total>0).sort((a,b)=>b.total-a.total);

  let html = rows.map((k,i)=>{
    const pct = Math.round(k.total/total*100);
    // Entries for this category, sorted by date
    const entries = cache
      .filter(e=>e.kategori===k.label)
      .sort((a,b)=>Number(a.hari)-Number(b.hari));
    const detailItems = entries.map(e=>{
      const sb = (e.sumber||"Sendiri")==="Titipan"
        ? `<span class="cat-detail-sumber" style="background:#3b82f622;color:#3b82f6">Titipan</span>`
        : (e.sumber||"Sendiri")==="Budget Khusus"
        ? `<span class="cat-detail-sumber" style="background:#8b5cf622;color:#8b5cf6">Khusus</span>`
        : "";
      return `<div class="cat-detail-item">
        <span class="cat-detail-date">${e.hari} Mei</span>
        <span class="cat-detail-ket">${e.keterangan||"—"}</span>
        <span class="cat-detail-amt" style="color:${k.color}">Rp ${fmt(e.jumlah)}${sb}</span>
      </div>`;
    }).join("");

    return `<div class="cat-row" onclick="toggleCatDetail('catdetail-${i}')">
      <div><span class="cat-dot" style="background:${k.color}"></span><span class="cat-name">${k.label}</span>
      <span style="font-size:10px;color:#444;margin-left:4px">(${entries.length}x)</span></div>
      <span class="cat-amount" style="color:${k.color}">Rp ${fmt(k.total)} <span style="color:#444;font-size:10px;font-weight:400">${pct}%</span> <span style="color:#555;font-size:10px">▾</span></span>
    </div>
    <div class="cat-detail" id="catdetail-${i}">${detailItems}</div>`;
  }).join("");

  html += `<div class="cat-bar-wrap">${
    rows.map(k=>`<div style="width:${Math.round(k.total/total*100)}%;background:${k.color};height:100%"></div>`).join("")
  }</div>`;
  bd.innerHTML = html;
}

function toggleCatDetail(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle("show");
  // flip arrow
  const row = el.previousElementSibling;
  if(row){
    const arrow = row.querySelector("span[style*='color:#555']");
    if(arrow) arrow.textContent = el.classList.contains("show") ? "▴" : "▾";
  }
}

function renderDayPanel(){
  const placeholder = document.getElementById("dayPanelPlaceholder");
  if(!selDay){
    document.getElementById("dayPanel").style.display="none";
    if(placeholder) placeholder.style.display="flex";
    return;
  }
  document.getElementById("dayPanel").style.display="block";
  if(placeholder) placeholder.style.display="none";
  const entries = getEntries(selDay);
  const total   = sumEntries(entries);
  const dow     = new Date(curYear,curMonth,selDay).getDay();
  const dowName = DAYS_ID[dow===0?6:dow-1];
  document.getElementById("dayPanelTitle").textContent = `${dowName}, ${selDay} ${MONTHS[curMonth]}`;
  document.getElementById("dayPanelTotal").textContent = total>0 ? "Rp "+fmt(total) : "";
  const list = document.getElementById("entriesList");
  if(!entries.length){
    list.innerHTML=`<div class="day-empty">Belum ada catatan.<br>Tap "+ Tambah" untuk mulai.</div>`;
    return;
  }
  list.innerHTML="";
  const wrap=document.createElement("div");
  wrap.className="entries-list";
  entries.forEach(e=>{
    const kat=KATEGORI.find(k=>k.label===e.kategori)||KATEGORI[6];
    const el=document.createElement("div");
    el.className="entry-item";
    el.id="entry-"+e.id;
    el.style.borderLeftColor=kat.color;
    const sumber = e.sumber || "Sendiri";
    const sbadge = sumber==="Titipan" ? "badge-titipan" : sumber==="Budget Khusus" ? "badge-khusus" : "badge-sendiri";
    el.innerHTML=`<div style="flex:1;min-width:0">
      <div class="entry-kat">${e.kategori}${sbadge?`<span class="sumber-badge ${sbadge}">${sumber}</span>`:""}</div>
      ${e.keterangan?`<div class="entry-ket">${e.keterangan}</div>`:""}
    </div>
    <div class="entry-right">
      <span class="entry-amt" style="color:${kat.color}">Rp ${fmt(e.jumlah)}</span>
      <button class="btn-edit" onclick="onEdit('${e.id}')">✎</button>
      <button class="btn-del" onclick="onHapus('${e.id}')">×</button>
    </div>`;
    wrap.appendChild(el);
  });
  list.appendChild(wrap);
}

const SUMBER_OPTIONS = [
  {label:"Sendiri", cls:"sel-sendiri"},
  {label:"Titipan", cls:"sel-titipan"},
  {label:"Budget Khusus", cls:"sel-khusus"},
];

function renderSumberGrid(){
  const grid=document.getElementById("sumberGrid");
  if(!grid) return;
  grid.innerHTML="";
  SUMBER_OPTIONS.forEach(s=>{
    const btn=document.createElement("button");
    const isSel=selSumber===s.label;
    btn.className="sumber-btn"+(isSel?" "+s.cls:"");
    btn.textContent=s.label;
    btn.onclick=()=>{ selSumber=s.label; renderSumberGrid(); };
    grid.appendChild(btn);
  });
}

function renderKatGrid(){
  const grid=document.getElementById("katGrid");
  grid.innerHTML="";
  KATEGORI.forEach(k=>{
    const btn=document.createElement("button");
    btn.className="kat-btn"+(selKat===k.label?" sel":"");
    btn.textContent=k.label;
    if(selKat===k.label){ btn.style.borderColor=k.color; btn.style.background=k.color+"22"; btn.style.color=k.color; }
    btn.onclick=()=>{ selKat=k.label; renderKatGrid(); };
    grid.appendChild(btn);
  });
}

// ── Actions ──────────────────────────────────────────────────
function changeMonth(dir){
  curMonth+=dir;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0) {curMonth=11;curYear--;}
  selDay=null;
  closeForm();
  cache=[];
  loadMonth();
}

function selectDay(d){
  selDay=d;
  closeForm();
  renderAll();
  setTimeout(()=>document.getElementById("dayPanel").scrollIntoView({behavior:"smooth",block:"nearest"}),80);
}

function onTambah(){
  if(!pinAuthed){ requestPin(()=>{ openForm(); }); return; }
  openForm();
}

function openForm(entry=null){
  showForm=true;
  editingId = entry ? entry.id : null;
  document.getElementById("formWrap").classList.add("show");
  document.getElementById("inpKet").value = entry ? (entry.keterangan||"") : "";
  document.getElementById("inpJumlah").value = entry ? entry.jumlah : "";
  selKat    = entry ? entry.kategori : KATEGORI[0].label;
  selSumber = entry ? (entry.sumber||"Sendiri") : "Sendiri";
  document.getElementById("btnSave").textContent = entry ? "Update" : "Simpan";
  document.getElementById("formTitle").textContent = entry ? "Edit Entri" : "Tambah Entri";
  renderKatGrid();
  renderSumberGrid();
  checkSave();
  setTimeout(()=>document.getElementById("formWrap").scrollIntoView({behavior:"smooth",block:"nearest"}),80);
}

function closeForm(){
  showForm=false;
  editingId=null;
  document.getElementById("formWrap").classList.remove("show");
  document.getElementById("btnSave").textContent="Simpan";
  document.getElementById("formTitle").textContent="Tambah Entri";
}

function checkSave(){
  const v=document.getElementById("inpJumlah").value;
  document.getElementById("btnSave").className="btn-save"+(v&&!isNaN(Number(v))?" ready":"");
}

async function saveEntry(){
  const jumlah=document.getElementById("inpJumlah").value;
  if(!jumlah||isNaN(Number(jumlah))) return;

  const pin = sessionStorage.getItem("pin");
  const ket = document.getElementById("inpKet").value.trim();
  const isEdit = !!editingId;
  const id  = isEdit ? editingId : Date.now().toString();
  const entry = {
    id, tanggal:`${selDay}/${curMonth+1}/${curYear}`,
    tahun:curYear, bulan:curMonth+1, hari:selDay,
    kategori:selKat, keterangan:ket, jumlah:Number(jumlah),
    sumber:selSumber
  };

  // Optimistic update
  if(isEdit){
    cache = cache.map(e=>e.id===id ? entry : e);
  } else {
    cache.push(entry);
  }
  writeCache(curYear,curMonth,cache);
  closeForm();
  renderAll();

  // Sync ke server
  setSyncState("syncing", isEdit ? "Mengupdate..." : "Menyimpan...");
  try{
    const action = isEdit ? "update" : "add";
    const res = await apiFetch({...entry, action, pin, sumber: selSumber});
    if(res.ok){
      setSyncState("ok", isEdit ? "Diperbarui ✓" : "Tersimpan ✓");
      const fresh = await fetchFromServer(curYear,curMonth);
      if(fresh){ cache=fresh; renderAll(); }
    } else {
      // Rollback
      const fresh = await fetchFromServer(curYear,curMonth);
      if(fresh){ cache=fresh; renderAll(); }
      setSyncState("error", res.error==="Unauthorized" ? "PIN salah" : "Gagal menyimpan");
      if(res.error==="Unauthorized"){ pinAuthed=false; sessionStorage.removeItem("pinAuthed"); }
    }
  } catch(e){
    setSyncState("error","Gagal terhubung");
  }
}

function onHapus(id){
  if(!pinAuthed){ requestPin(()=>doDelete(id)); return; }
  doDelete(id);
}

function onEdit(id){
  if(!pinAuthed){ requestPin(()=>startEdit(id)); return; }
  startEdit(id);
}

function startEdit(id){
  const entry = cache.find(e=>e.id===id);
  if(!entry) return;
  openForm(entry);
}

async function doDelete(id){
  const pin = sessionStorage.getItem("pin");

  // 1. Optimistic update
  const prev = [...cache];
  cache = cache.filter(e=>e.id!==id);
  writeCache(curYear,curMonth,cache);
  const el = document.getElementById("entry-"+id);
  if(el) el.classList.add("removing");
  renderAll();

  // 2. Sync ke server
  setSyncState("syncing","Menghapus...");
  try{
    const res = await apiFetch({action:"delete", id, pin});
    if(res.ok){
      setSyncState("ok","Terhapus ✓");
    } else {
      // Rollback
      cache = prev;
      writeCache(curYear,curMonth,cache);
      renderAll();
      setSyncState("error", res.error==="Unauthorized" ? "PIN salah — data tidak terhapus" : "Gagal menghapus");
      if(res.error==="Unauthorized"){ pinAuthed=false; sessionStorage.removeItem("pinAuthed"); }
    }
  } catch(e){
    cache=prev; writeCache(curYear,curMonth,cache); renderAll();
    setSyncState("error","Gagal terhubung");
  }
}

function toggleDetail(){
  showDetail=!showDetail;
  document.getElementById("catBreakdown").classList.toggle("show",showDetail);
  document.getElementById("btnDetail").classList.toggle("active",showDetail);
  if(showDetail) renderCatBreakdown();
}

// ── PIN Modal ─────────────────────────────────────────────────
function requestPin(cb){
  pinCallback=cb;
  document.getElementById("pinModal").style.display="flex";
  document.getElementById("pinInput").value="";
  document.getElementById("pinError").textContent="";
  setTimeout(()=>document.getElementById("pinInput").focus(),100);
}

async function confirmPin(){
  const val = document.getElementById("pinInput").value.trim();
  if(!val){ document.getElementById("pinError").textContent="Masukkan PIN dulu."; return; }

  const btn = document.querySelector(".btn-pin");
  btn.textContent="Memverifikasi...";
  btn.disabled=true;

  try {
    const res = await apiFetch({action:"verify", pin:val});
    if(res.ok){
      sessionStorage.setItem("pin", val);
      pinAuthed=true;
      sessionStorage.setItem("pinAuthed","1");
      document.getElementById("pinModal").style.display="none";
      if(pinCallback){ pinCallback(); pinCallback=null; }
    } else {
      document.getElementById("pinError").textContent="PIN salah. Coba lagi.";
      document.getElementById("pinInput").value="";
      document.getElementById("pinInput").focus();
    }
  } catch(e){
    document.getElementById("pinError").textContent="Gagal terhubung. Cek koneksi.";
  }

  btn.textContent="Konfirmasi";
  btn.disabled=false;
}

function cancelPin(){
  document.getElementById("pinModal").style.display="none";
  pinCallback=null;
}

function clearPinError(){
  document.getElementById("pinError").textContent="";
}

// ── Init ──────────────────────────────────────────────────────
loadMonth();
</script>
